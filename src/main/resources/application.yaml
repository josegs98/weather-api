spring:
  application:
    name: weather-api
  config:
    import: optional:classpath:application-local.yaml
  data:
    redis:
      host: localhost
      port: 1025
  cache:
    type: redis

visualcrossing:
  base-url: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline
  api-key: ${VISUAL_CROSSING_API_KEY:}
  unit-group: metric
  lang: es

weather:
  max-range-days: 14

weather-cache:
  forecast-today-ttl: 10m
  forecast-range-ttl: 40m
